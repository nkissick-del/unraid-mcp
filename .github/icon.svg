<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="#1C1C1C" stroke="#E64A19" stroke-width="6"/>

  <!-- Server tower (Unraid-inspired) - 4 drive bays -->
  <rect x="156" y="120" width="200" height="272" rx="12" fill="#2D2D2D" stroke="#E64A19" stroke-width="3"/>

  <!-- Drive bay 1 -->
  <rect x="172" y="136" width="168" height="48" rx="6" fill="#3A3A3A" stroke="#555" stroke-width="1.5"/>
  <circle cx="320" cy="160" r="6" fill="#4CAF50"/>
  <rect x="184" y="152" width="80" height="4" rx="2" fill="#555"/>

  <!-- Drive bay 2 -->
  <rect x="172" y="196" width="168" height="48" rx="6" fill="#3A3A3A" stroke="#555" stroke-width="1.5"/>
  <circle cx="320" cy="220" r="6" fill="#4CAF50"/>
  <rect x="184" y="212" width="60" height="4" rx="2" fill="#555"/>

  <!-- Drive bay 3 -->
  <rect x="172" y="256" width="168" height="48" rx="6" fill="#3A3A3A" stroke="#555" stroke-width="1.5"/>
  <circle cx="320" cy="280" r="6" fill="#4CAF50"/>
  <rect x="184" y="272" width="100" height="4" rx="2" fill="#555"/>

  <!-- Drive bay 4 -->
  <rect x="172" y="316" width="168" height="48" rx="6" fill="#3A3A3A" stroke="#555" stroke-width="1.5"/>
  <circle cx="320" cy="340" r="6" fill="#FF9800"/>
  <rect x="184" y="332" width="40" height="4" rx="2" fill="#555"/>

  <!-- MCP connection nodes radiating from server -->
  <!-- Right side nodes -->
  <line x1="356" y1="160" x2="420" y2="130" stroke="#E64A19" stroke-width="2.5" stroke-dasharray="6,3"/>
  <circle cx="430" cy="125" r="14" fill="#1C1C1C" stroke="#E64A19" stroke-width="2.5"/>
  <text x="430" y="130" text-anchor="middle" fill="#E64A19" font-size="14" font-weight="bold" font-family="monospace">{}</text>

  <line x1="356" y1="280" x2="420" y2="310" stroke="#E64A19" stroke-width="2.5" stroke-dasharray="6,3"/>
  <circle cx="430" cy="315" r="14" fill="#1C1C1C" stroke="#E64A19" stroke-width="2.5"/>
  <text x="430" y="320" text-anchor="middle" fill="#E64A19" font-size="14" font-weight="bold" font-family="monospace">&lt;/&gt;</text>

  <!-- Left side nodes -->
  <line x1="156" y1="160" x2="92" y2="130" stroke="#E64A19" stroke-width="2.5" stroke-dasharray="6,3"/>
  <circle cx="82" cy="125" r="14" fill="#1C1C1C" stroke="#E64A19" stroke-width="2.5"/>
  <text x="82" y="131" text-anchor="middle" fill="#E64A19" font-size="16" font-weight="bold" font-family="sans-serif">AI</text>

  <line x1="156" y1="280" x2="92" y2="310" stroke="#E64A19" stroke-width="2.5" stroke-dasharray="6,3"/>
  <circle cx="82" cy="315" r="14" fill="#1C1C1C" stroke="#E64A19" stroke-width="2.5"/>
  <path d="M75 312 L82 318 L89 312" stroke="#E64A19" stroke-width="2" fill="none"/>
  <line x1="82" y1="308" x2="82" y2="318" stroke="#E64A19" stroke-width="2"/>

  <!-- "MCP" label at bottom -->
  <text x="256" y="430" text-anchor="middle" fill="#E64A19" font-size="32" font-weight="bold" font-family="monospace" letter-spacing="8">MCP</text>

  <!-- Small "unraid" label above MCP -->
  <text x="256" y="405" text-anchor="middle" fill="#888" font-size="16" font-family="sans-serif" letter-spacing="3">UNRAID</text>
</svg>
